// ---------- DATA (original summaries of standard topics; verify against the textbooks) ----------
const REF={e:"The Electronics Handbook (Whitaker)",s:"Microelectronic Circuits (Sedra & Smith)",m:"Digital Design (Mano)"};
const L=[
["Circuit Theory",1,"Ohm's law links voltage, current and resistance. KCL: currents into a node sum to zero (charge conservation). KVL: voltages around a loop sum to zero (energy conservation). Thevenin replaces any linear network with one source and one resistor seen from two terminals; maximum power reaches the load when RL = Rth.","V=IR · P=VI=I²R · Rs=R1+R2 · Rp=R1R2/(R1+R2) · Pmax=Vth²/4Rth","Divider: 12 V across 4 kΩ + 2 kΩ gives I=2 mA, V across 2 kΩ = 4 V.",REF.e],
["AC & Resonance",1,"Sinusoids become phasors so R, L and C turn into impedances: R, jωL, 1/(jωC). In a series RLC circuit reactances cancel at the resonant frequency, current peaks and the circuit selects a narrow band; Q measures that sharpness.","XL=ωL · XC=1/ωC · f0=1/(2π√LC) · Q=(1/R)√(L/C) · BW=f0/Q","L=10 mH, C=1 µF: f0≈1.59 kHz.",REF.e],
["Semiconductor Diode",1,"A PN junction conducts when forward biased above its knee (about 0.7 V for silicon) and blocks in reverse. Current rises exponentially with voltage and doubles roughly every few millivolts-per-decade shift with temperature. Rectifiers use diodes to convert AC to DC; a filter capacitor smooths the ripple. A Zener diode in reverse breakdown holds a reference voltage.","I=Is(e^(V/nVT)−1) · VT=kT/q≈25.9 mV at 300 K · Vripple≈Vp/(2fRC) (full wave)","Vp=10 V, f=50 Hz, R=1 kΩ, C=470 µF: ripple≈10/(2·50·1000·470e-6)≈0.21 V.",REF.s],
["BJT Amplifier",2,"Bias the transistor so the DC operating point (Q-point) sits mid load line; otherwise the output clips. In the active region IC=βIB. For small signals the transistor behaves like a voltage-controlled current source with transconductance gm=IC/VT. A common-emitter stage inverts and amplifies.","IC=βIB · gm=IC/VT · Av≈−gm·RC · load line: VCE=VCC−ICRC","IC=1 mA gives gm≈38.6 mS; RC=4.7 kΩ gives Av≈−181 (unloaded).",REF.s],
["Op-amps & Feedback",2,"An ideal op-amp has infinite gain, infinite input resistance and zero output resistance. With negative feedback the two inputs sit at the same voltage (virtual short), so gain depends only on resistors. Real parts have limits: finite gain-bandwidth, slew rate and output swing.","Inverting: Av=−Rf/Rin · Non-inverting: Av=1+Rf/R1 · GBW=Av·f−3dB","Rf=100 kΩ, Rin=10 kΩ: gain −10; 0.5 V input gives −5 V.",REF.s],
["Digital Logic",2,"Digital circuits use two levels, so noise rarely flips a bit. Any function can be written as a truth table, a Boolean expression or a K-map. NAND and NOR are universal. Sequential circuits add memory with flip-flops; counters, registers and finite state machines are built from them.","A+A′B=A+B · (AB)′=A′+B′ · (A+B)′=A′B′ · n inputs → 2ⁿ rows · Half adder: S=A⊕B, C=AB","Simplify Y=A+A′B: (A+A′)(A+B)=A+B.",REF.m],
["Signals & Systems",2,"A linear time-invariant system is described by its impulse response; output is the convolution of input and impulse response. Fourier analysis writes signals as sums of sinusoids so convolution becomes multiplication. Sampling a signal below twice its bandwidth causes aliasing.","y=x*h · Y(jω)=X(jω)H(jω) · fs≥2fmax · alias f=|f−k·fs|","Signal 9 Hz sampled at 12 Hz appears as 3 Hz.",REF.e],
["Analog Communication",3,"AM varies carrier amplitude, FM varies its frequency. The superheterodyne receiver mixes the incoming station down to a fixed intermediate frequency for easy filtering. Noise sets the minimum usable signal; SNR is the quality measure.","AM: s=(1+m·cos ωm t)cos ωc t · BW=2fm · FM: BW≈2(Δf+fm) (Carson)","m=0.5 gives sidebands at 25% each of carrier amplitude.",REF.e],
["Digital Communication",3,"Analog messages are sampled, quantised and coded (PCM). Bits are sent with ASK, FSK, PSK or QAM; noise causes errors measured as bit error rate. Shannon's theorem gives the maximum error-free rate for a channel and error-control codes (Hamming, CRC) approach it.","C=B·log2(1+SNR) · PCM rate=fs·n · BPSK BER=½erfc(√(Eb/N0)) · Hamming d=3 corrects 1 error","B=1 MHz, SNR=255 gives 8 Mbit/s.",REF.e],
["Control Systems",3,"Feedback compares output to a reference and corrects the error. A PID controller combines proportional, integral and derivative action: P speeds response, I removes steady-state error, D damps overshoot. Stability is judged with Routh, root locus, Bode or Nyquist.","u=Kp·e+Ki∫e dt+Kd·de/dt · ζ<1 → overshoot Mp=e^(−πζ/√(1−ζ²))","ζ=0.5 gives about 16% overshoot.",REF.e],
["Computer Networks",3,"Layered models (OSI, TCP/IP) split networking into link, network, transport and application duties. IP addresses are split into network and host bits by a subnet mask; TCP gives reliable streams, UDP gives low-latency datagrams.","hosts=2^(32−prefix)−2 · /26 mask=255.255.255.192","192.168.1.0/26 has 62 usable hosts.",REF.e],
["EM Waves & Lines",2,"Maxwell's equations predict waves travelling at c. On a transmission line a mismatch between load and characteristic impedance reflects part of the wave; VSWR measures the mismatch. Matching networks and the Smith chart fix it.","Γ=(ZL−Z0)/(ZL+Z0) · VSWR=(1+|Γ|)/(1−|Γ|) · dBm=10log10(P/1 mW)","ZL=100 Ω on 50 Ω line: Γ=0.33, VSWR=2.",REF.e]];
const T=["All",...new Set(L.map(l=>l[0]))];
const Q=[["Circuit Theory","Max power is delivered to the load when",["RL=Rth","RL=0","RL=∞","RL=2Rth"],0,"Matching gives Pmax=Vth²/4Rth."],
["Circuit Theory","6 Ω ∥ 3 Ω equals",["9 Ω","2 Ω","4.5 Ω","1 Ω"],1,"(6·3)/(6+3)=2 Ω."],
["Circuit Theory","KCL is a statement of conservation of",["Energy","Charge","Momentum","Power"],1,"Charge cannot accumulate at a node."],
["AC & Resonance","f0 for L=10 mH, C=1 µF",["159 Hz","1.59 kHz","15.9 kHz","6.28 kHz"],1,"1/(2π√(1e-8))≈1.59 kHz."],
["AC & Resonance","At series resonance the impedance is",["Maximum","Purely resistive, minimum","Purely inductive","Infinite"],1,"XL=XC, only R remains."],
["Semiconductor Diode","Silicon diode knee voltage is about",["0.2 V","0.7 V","1.4 V","5 V"],1,"Silicon ≈0.6–0.7 V."],
["Semiconductor Diode","Zener diodes are used in",["Forward bias for rectifying","Reverse breakdown for reference","Amplifying","Oscillating"],1,"They hold a stable reverse voltage."],
["Semiconductor Diode","Larger filter capacitor makes ripple",["Larger","Smaller","Unchanged","Negative"],1,"Vripple≈Vp/(2fRC)."],
["BJT Amplifier","For amplification a BJT must be in the",["Cut-off region","Saturation","Active region","Breakdown"],2,"Active: BE forward, BC reverse."],
["BJT Amplifier","Output clipping on one side usually means",["Q-point off-centre","Too little gain","Wrong supply polarity","Open input"],0,"Bias shifted away from mid load line."],
["BJT Amplifier","gm at IC=1 mA (VT=25 mV) is",["4 mS","40 mS","400 mS","1 S"],1,"IC/VT=40 mS."],
["Op-amps & Feedback","Inverting amp, Rf=100 kΩ, Rin=10 kΩ: gain",["−10","10","11","−11"],0,"−Rf/Rin."],
["Op-amps & Feedback","Non-inverting gain with Rf=9 kΩ, R1=1 kΩ",["9","10","−9","8"],1,"1+Rf/R1."],
["Op-amps & Feedback","Virtual short exists because of",["Negative feedback","Positive feedback","Zero supply","Slew rate"],0,"High gain and negative feedback."],
["Digital Logic","NAND output when both inputs are 1",["0","1","Undefined","Same as input"],0,"NOT(AND)."],
["Digital Logic","Universal gate pair",["AND, OR","NAND, NOR","XOR, XNOR","NOT, AND"],1,"Any function from NAND only or NOR only."],
["Digital Logic","Rows in a 3-input truth table",["3","6","8","9"],2,"2³=8."],
["Digital Logic","A + A·B simplifies to",["A·B","A","A+B","B"],1,"Absorption law."],
["Signals & Systems","Minimum sampling rate for a 4 kHz signal",["4 kHz","6 kHz","8 kHz","16 kHz"],2,"fs≥2fmax."],
["Analog Communication","AM bandwidth for 5 kHz message",["5 kHz","10 kHz","20 kHz","2.5 kHz"],1,"BW=2fm."],
["Digital Communication","Capacity of B=1 MHz, SNR=255",["1 Mbit/s","4 Mbit/s","8 Mbit/s","255 Mbit/s"],2,"B·log2(256)=8 Mbit/s."],
["Control Systems","Integral action mainly removes",["Overshoot","Steady-state error","Noise","Delay"],1,"I term drives error to zero."],
["Computer Networks","Usable hosts in /26",["26","30","62","64"],2,"2⁶−2."],
["EM Waves & Lines","VSWR of a perfectly matched line",["0","1","2","∞"],1,"Γ=0 → VSWR=1."]];
const PG=[["home","Home"],["learn","Learn"],["curr","Curriculum"],["lab","Virtual Lab"],["sims","Simulations"],["quiz","Quiz"],["rank","Leaderboard"],["prof","Profile"],["help","Help & Projects"],["admin","Admin"]];
const Y=[["Year 1 · Foundations",["Engineering Math","Circuit Theory","AC & Resonance","Semiconductor Basics","Power Basics","Measurement","Programming Foundations"]],["Year 2 · Core Electronics & Signals",["Analog Electronics","Op-amps & Feedback","Digital Electronics","Signals & Systems","EM Fields & Waves","Microcontrollers","Programming for ENTC"]],["Year 3 · Communication, DSP & Systems",["Random Processes","Analog Communication","Digital Communication","DSP","Control Systems","Computer Networks","VLSI Design","Antennas & Propagation","Sensors & Instrumentation","Power Electronics","Professional Skills","Programming for Systems"]],["Year 4 · Specialisation & Industry",["Wireless & Mobile","Microwave & RF","Optical Fibre","Satellite & Radar","Advanced IoT & Embedded","AI/ML for ENTC","Image & Video Processing","Cryptography & Security","Advanced VLSI","EMI/EMC, PCB & Standards"]]];
const PROJ=[["Smart street light","LDR + comparator + MCU. Marks: circuit diagram, code, test table."],["Keypad door lock (FSM)","State diagram, Verilog/C, 3-failure lockout."],["IoT environment monitor","Sensor + MQTT dashboard, publish every minute."],["ECG/audio denoiser","Notch/FIR filter in Python; plot spectra before and after."],["Regulated power supply","Transformer, rectifier, filter, Zener/LM7805; measure ripple and load regulation."],["Predictive maintenance (TinyML)","Vibration data, classifier, edge deployment."],["Capstone","GitHub README, demo video, 3+ project portfolio."]];

const KEY="cv_state_v2";let S=JSON.parse(localStorage.getItem(KEY)||"null")||{users:{},cur:null};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S)),me=()=>S.users[S.cur]||null,dk=d=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
async function hash(pw,salt){const b=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]),d=await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(salt),iterations:150000,hash:"SHA-256"},b,256);return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2200)}
function award(xp){const u=me();if(!u)return toast("Log in to earn XP");u.xp+=xp;const d=new Date().toDateString();if(u.last!==d){u.streak=u.last===new Date(Date.now()-864e5).toDateString()?u.streak+1:1;u.last=d}const k=dk(new Date());u.att[k]=(u.att[k]||0)+1;save();hud();toast("+"+xp+" XP · "+u.streak+"-day streak")}
function hud(){const u=me();$("#hud").textContent=u?`${u.name} · ${u.xp} XP · 🔥${u.streak}`:"Guest";$("#authBtn").textContent=u?"Log out":"Log in"}
let reg=false,tries=0,lock=0;
$("#authBtn").onclick=()=>{if(me()){S.cur=null;save();hud();go(cur);return}$("#ad").classList.add("on")};$("#acl").onclick=()=>$("#ad").classList.remove("on");
$("#asw").onclick=()=>{reg=!reg;$("#at").textContent=reg?"Create account":"Log in";$("#asw").textContent=reg?"I have an account":"Create account"};
$("#auf").onsubmit=async e=>{e.preventDefault();const er=$("#aerr");if(Date.now()<lock){er.textContent="Too many attempts. Wait 30 seconds.";return}
const em=clean($("#ae").value,100).toLowerCase(),pw=$("#ap").value;if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)||pw.length<8){er.textContent="Enter a valid email and a password of 8+ characters.";return}
if(reg){if(S.users[em]){er.textContent="Account exists. Log in instead.";return}const salt=crypto.getRandomValues(new Uint32Array(4)).join("-");S.users[em]={name:clean($("#an").value,60)||"Learner",email:em,salt,h:await hash(pw,salt),xp:0,streak:0,last:"",done:{},quiz:0,country:"India",bio:"",edu:"",contact:"",priv:false,role:"user",att:{}};S.cur=em}
else{const u=S.users[em];if(!u||await hash(pw,u.salt)!==u.h){if(++tries>=5){lock=Date.now()+3e4;tries=0}er.textContent="Email or password is incorrect.";return}S.cur=em}
tries=0;er.textContent="";save();$("#ad").classList.remove("on");hud();go(cur);award(10)};

let io;function obs(){io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("v");io.unobserve(e.target)}}),{threshold:.1});$$(".page.on .rv").forEach(x=>io.observe(x))}

R.lab=()=>{$("#lab").innerHTML=`<h2>Virtual Lab · Ohm's law bench</h2><p class="mut">Series circuit with an ammeter in the loop and a voltmeter across R2. Needles are animated; charge flow speeds up with current.</p>
<div class="grid"><div class="card rv"><svg viewBox="0 0 300 130"><path class="wire" id="wr" d="M20 20H110M190 20H280V110H20Z"/><rect x="110" y="8" width="80" height="24" fill="#000" stroke="#00ff41"/><text x="150" y="25" font-size="12" fill="#00ff41" text-anchor="middle">R1</text><rect x="120" y="98" width="70" height="24" fill="#000" stroke="#00ff41"/><text x="155" y="115" font-size="12" fill="#00ff41" text-anchor="middle">R2</text><text x="6" y="70" font-size="12" fill="#00ff41">Vs</text><text x="240" y="70" font-size="12" fill="#00ff41">A</text><circle cx="280" cy="65" r="12" fill="none" stroke="#00ff41"/></svg>
<label>Vs <b id="v0"></b> V<input type="range" id="vs" min="0" max="24" step=".5" value="12"></label><label>R1 <b id="v1"></b> Ω<input type="range" id="r1" min="10" max="1000" step="10" value="200"></label><label>R2 <b id="v2"></b> Ω<input type="range" id="r2" min="10" max="1000" step="10" value="100"></label><p id="lo" class="mut"></p><button class="btn" id="ck">Task: make V(R2) = 6.0 V ± 0.2</button></div>

const up=()=>{const vs=+$("#vs").value,r1=+$("#r1").value,r2=+$("#r2").value,I=vs/(r1+r2),V=I*r2;$("#v0").textContent=vs;$("#v1").textContent=r1;$("#v2").textContent=r2;setM("A",I,.5,I.toFixed(3)+" A");setM("V",V,24,V.toFixed(2)+" V");$("#wr").style.animationDuration=I>0?Math.max(.15,.5/(I*4+.1))+"s":"0s";$("#lo").textContent=`I=${(I*1e3).toFixed(1)} mA · V1=${(I*r1).toFixed(2)} V · V2=${V.toFixed(2)} V · V1+V2=Vs ✔ (KVL)`;return V};

$("#ck").onclick=()=>{Math.abs(up()-6)<=.2?(toast("Correct: R2/(R1+R2)·Vs = 6 V"),award(30)):toast("Not yet. Use V2=Vs·R2/(R1+R2)")};
const nd=(a,b)=>+!(a&b),G={AND:(a,b)=>a&b,OR:(a,b)=>a|b,NAND:nd,NOR:(a,b)=>+!(a|b),XOR:(a,b)=>a^b,XNOR:(a,b)=>+!(a^b)},seen={};
const lg=()=>{const a=+$("#sa").checked,b=+$("#sb").checked,g=$("#gt").value,y=g[3]==="f"||g.startsWith("XOR f")?(n=>nd(nd(a,n),nd(b,n)))(nd(a,b)):G[g](a,b);$("#ly").classList.toggle("on",!!y);seen[g+a+b]=y;$("#lx").textContent=`${g}(${a},${b}) = ${y}`;$("#tt").innerHTML="<tr><th>A</th><th>B</th><th>Y</th></tr>"+[[0,0],[0,1],[1,0],[1,1]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${seen[g+r[0]+r[1]]??"?"}</td></tr>`).join("")};

// ---------- simulations ----------
const N=400,A=f=>Array.from({length:N},(_,i)=>f(i)),erfc=x=>{const t=1/(1+.5*x);return t*Math.exp(-x*x-1.26551223+t*(1.00002368+t*(.37409196+t*(.09678418+t*(-.18628806+t*(.27886807+t*(-1.13520398+t*(1.48851587+t*(-.82215223+t*.17087277)))))))))};
const SIM=[
{n:"Voltage divider",p:[["Vs (V)",1,24,12,1],["R1 (Ω)",100,5000,1000,100]],f:v=>({s:[A(i=>v[0]*i*25/(v[1]+i*25))],i:`x: R2 0→10 kΩ. Vout=Vs·R2/(R1+R2). At R2=R1, Vout=${v[0]/2} V.`})},
{n:"Diode I–V",p:[["n (ideality)",1,2,1,.05],["Temp (K)",250,400,300,5]],f:v=>{const VT=8.617e-5*v[1],Is=1e-12;return{s:[A(i=>Math.min(100,Is*(Math.exp(i/N*.9/(v[0]*VT))-1)*1e3))],i:`x: 0→0.9 V, y: mA (clipped 100). VT=${(VT*1e3).toFixed(1)} mV. Knee (1 mA) at ${(v[0]*VT*Math.log(1e-3/Is)).toFixed(2)} V.`}}},
{n:"Rectifier + filter",p:[["Vp (V)",5,20,10,1],["C (µF)",10,2200,470,10],["RL (Ω)",100,5000,1000,100]],f:v=>{const o=[],vi=[],dt=.06/N;let vo=0;for(let i=0;i<N;i++){const t=i*dt,r=Math.max(0,Math.abs(v[0]*Math.sin(2*Math.PI*50*t))-.7);vo=r>vo?r:vo-vo/(v[2]*v[1]*1e-6)*dt;o.push(vo);vi.push(r)}const l=o.slice(-130);return{s:[vi,o],i:`Full-wave, 50 Hz. Simulated ripple ${(Math.max(...l)-Math.min(...l)).toFixed(2)} V; formula Vp/(2fRC)=${(v[0]/(100*v[2]*v[1]*1e-6)).toFixed(2)} V.`}}},
{n:"BJT load line",p:[["VCC (V)",5,20,12,1],["RC (Ω)",500,5000,2000,100],["IB (µA)",5,100,30,1]],f:v=>{const ics=v[0]/v[1],ic=Math.min(100*v[2]*1e-6,ics),vce=v[0]-ic*v[1];return{s:[A(i=>(v[0]-i/N*v[0])/v[1]*1e3),A(()=>ic*1e3)],i:`β=100. Q: IC=${(ic*1e3).toFixed(2)} mA, VCE=${vce.toFixed(2)} V (${ic>=ics?"saturated":"active"}). Gain≈${(-ic/.025*v[1]).toFixed(0)}. x: VCE 0→VCC.`}}},
{n:"Op-amp amplifier",p:[["Rf (kΩ)",1,200,100,1],["Rin (kΩ)",1,100,10,1],["Vin pk (V)",.1,5,.5,.1]],f:v=>{const g=-v[0]/v[1],lim=10.5,vi=A(i=>v[2]*Math.sin(i/N*4*Math.PI)),vo=vi.map(x=>Math.max(-lim,Math.min(lim,g*x)));return{s:[vi,vo],i:`Gain ${g.toFixed(1)}. ${Math.abs(g*v[2])>lim?"CLIPPING at ±"+lim+" V rails.":"Linear."}`}}},
{n:"RC low-pass Bode",p:[["R (kΩ)",.1,100,10,.1],["C (nF)",1,1000,100,1]],f:v=>{const fc=1/(2*Math.PI*v[0]*1e3*v[1]*1e-9);return{s:[A(i=>-10*Math.log10(1+Math.pow(Math.pow(10,i/N*6)/fc,2)))],i:`x: 1 Hz→1 MHz (log). fc=${fc.toFixed(1)} Hz, −3 dB there, −20 dB/decade after.`}}},
{n:"AM modulation",p:[["Mod index m",0,1.5,.6,.05],["Carrier cycles",15,60,40,1]],f:v=>({s:[A(i=>(1+v[0]*Math.cos(i/N*4*Math.PI))*Math.cos(i/N*2*Math.PI*v[1])),A(i=>1+v[0]*Math.cos(i/N*4*Math.PI))],i:`Sidebands at ${(v[0]/2*100).toFixed(0)}% of carrier each. BW=2fm. ${v[0]>1?"OVERMODULATION: envelope distorts.":"Envelope detector recovers message."}`})},
{n:"Sampling & aliasing",p:[["Signal f (Hz)",1,20,9,1],["Sample fs (Hz)",4,40,12,1]],f:v=>{const s=k=>Math.sin(2*Math.PI*v[0]*k/v[1]);return{s:[A(i=>Math.sin(2*Math.PI*v[0]*i/N)),A(i=>{const t=i/N*v[1],k=Math.floor(t);return s(k)+(s(k+1)-s(k))*(t-k)})],i:v[1]>=2*v[0]?"fs ≥ 2f: signal recoverable.":`ALIASING: appears as ${Math.abs(v[0]-Math.round(v[0]/v[1])*v[1])} Hz.`}}},
{n:"PID step response",p:[["Kp",0,20,4,.5],["Ki",0,20,2,.5],["Kd",0,5,.5,.1]],f:v=>{let x=0,xd=0,ig=0,pe=1;const y=[];for(let i=0;i<N;i++){for(let k=0;k<4;k++){const e=1-x,u=v[0]*e+v[1]*(ig+=e*.005)+v[2]*(e-pe)/.005;pe=e;xd+=(-.6*xd-9*x+9*Math.max(-50,Math.min(50,u)))*.005;x+=xd*.005}y.push(Math.max(-3,Math.min(3,x)))}const mx=Math.max(...y);return{s:[A(()=>1),y],i:`Plant 9/(s²+0.6s+9), 8 s. Peak ${mx.toFixed(2)} (${Math.max(0,(mx-1)*100).toFixed(0)}% overshoot), final ${y[N-1].toFixed(2)}.`}}},
{n:"BER vs Eb/N0",p:[["Coding gain (dB)",0,6,0,.5]],f:v=>({s:[A(i=>Math.log10(Math.max(1e-12,.5*erfc(Math.sqrt(Math.pow(10,(i/N*14+v[0])/10)))))),A(i=>Math.log10(Math.max(1e-12,.375*erfc(Math.sqrt(.4*Math.pow(10,(i/N*14+v[0])/10))))))],i:"x: Eb/N0 0→14 dB, y: log10 BER. Upper-left curve is 16-QAM (needs more SNR), lower is BPSK."})},
{n:"Series RLC resonance",p:[["R (Ω)",1,200,20,1],["L (mH)",1,50,10,1],["C (µF)",.1,10,1,.1]],f:v=>{const L=v[1]/1e3,C=v[2]/1e6,f0=1/(2*Math.PI*Math.sqrt(L*C));return{s:[A(i=>{const w=2*Math.PI*f0*3*(i+1)/N;return 1/Math.hypot(v[0],w*L-1/(w*C))})],i:`f0=${f0.toFixed(0)} Hz, Q=${(Math.sqrt(L/C)/v[0]).toFixed(2)}, BW=${(f0/(Math.sqrt(L/C)/v[0])).toFixed(0)} Hz. Peak at x=1/3 of axis.`}}},
{n:"555 astable",p:[["R1 (kΩ)",1,100,10,1],["R2 (kΩ)",1,100,47,1],["C (nF)",1,1000,100,1]],f:v=>{const T=.693*(v[0]+2*v[1])*1e3*v[2]*1e-9,th=.693*(v[0]+v[1])*1e3*v[2]*1e-9;return{s:[A(i=>(i/N*3*T)%T<th?1:0)],i:`f=${(1/T).toFixed(1)} Hz, duty ${(th/T*100).toFixed(0)}%. Window shows 3 periods.`}}},
{n:"Smart street light",p:[["Threshold",200,900,600,10],["Hysteresis band",0,100,40,5],["Noise",0,150,60,5]],f:v=>{let on=false;const ad=A(i=>Math.round(1023*(.5-.5*Math.cos(i/N*2*Math.PI))*.9+Math.sin(i*1.3)*v[2]*Math.cos(i*.37))),lp=ad.map(a=>{if(a>v[0]+v[1])on=true;else if(a<v[0]-v[1])on=false;return on?900:100});let sw=0;lp.forEach((x,i)=>{if(i&&x!==lp[i-1])sw++});return{s:[ad,lp,A(()=>v[0])],i:`Dusk→night→dawn (dark = high ADC). Lamp switched ${sw} times. Raise the hysteresis band to remove flicker.`}}}];

$("#rank").innerHTML=`<h2>Leaderboards</h2><p class="mut">Sample rows plus you (unless your profile is private).</p><div class="row"><button class="btn ${lm=="g"?"":"o"}" data-l="g">Global</button><button class="btn ${lm=="c"?"":"o"}" data-l="c">My country</button></div><div class="card"><table><tr><th>#</th><th>Name</th><th>Country</th><th>XP</th></tr>${l.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${r[2]}</td></tr>`).join("")}</table></div>`;$$("[data-l]").forEach(b=>b.onclick=()=>{lm=b.dataset.l;R.rank()})};
R.prof=()=>{const u=me();let hm="";if(u){const t=new Date(),s=new Date(t.getFullYear(),t.getMonth(),t.getDate()-(52*7+t.getDay()));for(let i=0;i<53*7;i++){const d=new Date(s.getFullYear(),s.getMonth(),s.getDate()+i);if(d>t){hm+="<i style='visibility:hidden'></i>";continue}const c=u.att[dk(d)]||0;hm+=`<i title="${dk(d)}: ${c}" style="background:${["#0b1f10","#0e4429","#006d32","#26a641","#00ff41"][Math.min(4,c)]}"></i>`}}
$("#prof").innerHTML=`<h2>Profile</h2><div class="grid"><div class="card">${u?`<h3>${esc(u.name)}</h3><p class="mut">${esc(u.email)}${u.contact?" · "+esc(u.contact):""}</p><p>${esc(u.edu)||"No education added"}</p><p>${esc(u.bio)||"No bio yet"}</p><p>${esc(u.country)} · ${u.priv?"🔒 achievements private":"🌐 achievements public"}</p><p>XP ${u.xp} · 🔥 ${u.streak}-day streak · best quiz ${u.quiz}%</p>`:"Log in to see your profile."}</div><div class="card"><form id="pf"><label>Name<input type="text" id="pn" maxlength="60"></label><label>Contact<input type="text" id="pc" maxlength="20"></label><label>Education<input type="text" id="pe" maxlength="100"></label><label>Country<input type="text" id="po" maxlength="40"></label><label>Bio<textarea id="pb" maxlength="240" rows="3"></textarea></label><label><input type="checkbox" id="pp"> Keep my achievements private</label><br><button class="btn">Save profile</button></form></div></div>
<h2>Attendance calendar</h2><div class="card rv"><div id="hm">${hm}</div><div class="row"><button class="btn" id="ci">Mark today present (+5 XP)</button><small class="mut">Any learning activity also marks the day.</small></div></div>`;
if(u){$("#pn").value=u.name;$("#pc").value=u.contact;$("#pe").value=u.edu;$("#po").value=u.country;$("#pb").value=u.bio;$("#pp").checked=u.priv}
$("#pf").onsubmit=e=>{e.preventDefault();const u=me();if(!u)return toast("Log in first");u.name=clean($("#pn").value,60)||u.name;u.contact=clean($("#pc").value,20);u.edu=clean($("#pe").value,100);u.country=clean($("#po").value,40)||"India";u.bio=clean($("#pb").value,240);u.priv=$("#pp").checked;save();hud();R.prof();toast("Profile saved")};
$("#ci").onclick=()=>{const u=me();if(!u)return toast("Log in first");if(u.att[dk(new Date())])return toast("Already present today");award(5);R.prof();obs()}};
R.help=()=>{$("#help").innerHTML=`<h2>Help &amp; project ideas</h2><p class="mut">Mark-scoring college projects. Each should include a block diagram, circuit/code, test table and a short report.</p><div class="grid">${PROJ.map(p=>`<div class="card rv"><h3>${esc(p[0])}</h3><small class="mut">${esc(p[1])}</small></div>`).join("")}</div><div class="card rv"><h3>Study tips</h3><small>Derive formulas once, then practise numericals. Verify every simulation by hand for one data point. Use the AI button for hints before answers.</small></div>`};
R.admin=()=>{const u=me();$("#admin").innerHTML=`<h2>Admin</h2><div class="card">${u&&u.role==="admin"?`<p>Users: ${Object.keys(S.users).length}</p>`:"<b>Restricted.</b> Admin access must be enforced on a server. This static build keeps it locked."}</div>`};
// ---------- AI assistant ----------
const say=(t,c)=>{const d=document.createElement("div");d.className="m "+c;d.textContent=t;$("#msgs").append(d);$("#msgs").scrollTop=1e9};
$("#aib").onclick=()=>{$("#aip").classList.toggle("on");$("#msgs").children.length||say("Ask about any topic in Learn, e.g. resonance, NAND, Nyquist, PID, VSWR, subnet. Say 'hint' for a hint ladder.","b")};
$("#af").onsubmit=e=>{e.preventDefault();const t=clean($("#ai").value,300);if(!t)return;say(t,"u");$("#ai").value="";const w=t.toLowerCase().split(/\W+/).filter(x=>x.length>2);let b=null,bs=0;L.forEach(l=>{const s=w.reduce((a,x)=>a+(l[0].toLowerCase().includes(x)?3:0)+(l[2].toLowerCase().includes(x)?1:0)+(l[3].toLowerCase().includes(x)?1:0),0);if(s>bs){bs=s;b=l}});
say(/hint/.test(t.toLowerCase())?"Hint 1: restate what is given and asked. Hint 2: write the governing formula. Hint 3: substitute step by step and check units.":b?`${b[0]}: ${b[2]} Key formulas: ${b[3]}`:"No prepared answer for that yet. Open Learn for notes, or rephrase with a topic name.","b")};
// ---------- init ----------
hud();const h=location.hash.slice(1);go(R[h]?h:"home");
</script></body></html>
